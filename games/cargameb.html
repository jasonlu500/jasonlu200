<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>地平线·壮丽开放世界驾驶 · 飞行特技</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #0a1a2a; overflow: hidden; font-family: 'Segoe UI', 'PingFang SC', system-ui, sans-serif; touch-action: none; }
    #gameContainer { width: 100vw; height: 100vh; position: relative; cursor: grab; }
    #gameContainer:active { cursor: grabbing; }
    canvas { display: block; }
    #hud { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 10; }
    .dashboard { position: absolute; bottom: 30px; left: 30px; background: rgba(10,15,20,0.85); backdrop-filter: blur(20px); border: 2px solid rgba(255,140,0,0.8); border-radius: 25px; padding: 20px; color: #fff; min-width: 260px; box-shadow: 0 15px 40px rgba(0,0,0,0.6); }
    .speed-digital { font-size: 56px; font-weight: 900; color: #ff8c00; font-family: 'Courier New', monospace; text-shadow: 0 0 20px rgba(255,140,0,0.7); line-height: 1; }
    .gear-box { display: inline-block; background: #1a1a2e; border: 2px solid #ff8c00; border-radius: 12px; padding: 6px 16px; font-size: 28px; font-weight: bold; margin-top: 8px; }
    .gear-reverse { border-color: #ff4444; color: #ff4444; }
    .nitro-container { width: 220px; height: 22px; background: #111; border-radius: 11px; overflow: hidden; margin-top: 10px; border: 1px solid #333; }
    .nitro-fill { height: 100%; background: linear-gradient(90deg, #ff2a00, #ff8800, #ffcc00); transition: width 0.1s; }
    .info-row { display: flex; justify-content: space-between; margin-top: 8px; font-size: 12px; color: #bbb; }
    .mode-indicator { position: absolute; top: 30px; left: 30px; background: rgba(0,0,0,0.8); backdrop-filter: blur(10px); border: 2px solid #00ff88; border-radius: 20px; padding: 10px 18px; color: white; font-size: 16px; font-weight: bold; }
    .controls-hint { position: absolute; bottom: 30px; right: 30px; background: rgba(0,0,0,0.6); color: #ccc; font-size: 11px; padding: 8px 12px; border-radius: 8px; font-family: monospace; line-height: 1.6; pointer-events: none; }
    .minimap { position: absolute; bottom: 30px; right: 30px; width: 180px; height: 180px; background: rgba(0,0,0,0.75); border: 3px solid rgba(255,255,255,0.8); border-radius: 50%; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.6); }
    #mobileControls { position: absolute; bottom: 50px; left: 50%; transform: translateX(-50%); display: none; gap: 15px; z-index: 20; pointer-events: none; }
    .touch-btn { width: 65px; height: 65px; background: rgba(20,20,30,0.6); backdrop-filter: blur(15px); border: 2px solid rgba(255,255,255,0.4); border-radius: 50%; color: white; font-size: 24px; display: flex; align-items: center; justify-content: center; pointer-events: auto; user-select: none; transition: all 0.1s; font-weight: bold; }
    .touch-btn:active { background: rgba(255,140,0,0.7); transform: scale(0.85); border-color: #ff8c00; }
    .ped-hit-indicator { position: absolute; top: 80px; left: 50%; transform: translateX(-50%); background: rgba(255,0,0,0.8); color: white; padding: 8px 20px; border-radius: 20px; font-weight: bold; font-size: 20px; display: none; pointer-events: none; z-index: 30; }
    .stunt-indicator { position: absolute; top: 80px; left: 50%; transform: translateX(-50%); background: rgba(255,200,0,0.9); color: #1a1a2e; padding: 10px 24px; border-radius: 20px; font-weight: 900; font-size: 24px; display: none; pointer-events: none; z-index: 30; animation: stuntPulse 0.5s infinite alternate; }
    @keyframes stuntPulse { from { transform: translateX(-50%) scale(1); } to { transform: translateX(-50%) scale(1.1); } }
    .stunt-btn { background: rgba(255,200,0,0.3) !important; border-color: #ffcc00 !important; }
    @media (max-width: 900px) { #mobileControls { display: flex; } .dashboard { bottom: 140px; left: 10px; padding: 12px; min-width: 180px; } .speed-digital { font-size: 38px; } .minimap { bottom: 140px; right: 10px; width: 120px; height: 120px; } .controls-hint { bottom: 140px; font-size: 10px; } }
  </style>
</head>
<body>
  <div id="gameContainer">
    <div id="hud">
      <div class="mode-indicator" id="modeIndicator">🚗 驾驶模式</div>
      <div class="ped-hit-indicator" id="pedHitIndicator">💥 撞到行人！</div>
      <div class="stunt-indicator" id="stuntIndicator">✈️ 飞行特技！</div>
      <div class="dashboard" id="carDashboard">
        <div><span class="speed-digital" id="speedText">0</span><span class="speed-unit">km/h</span></div>
        <div class="gear-box" id="gearText">N</div>
        <div class="nitro-container"><div class="nitro-fill" id="nitroFill" style="width:100%"></div></div>
        <div class="info-row"><span>RPM: <b id="rpmText" style="color:#ff8c00">0</b></span><span id="driftStatus" style="color:#666">稳定</span></div>
        <div class="info-row"><span>档位: <b id="gearMode" style="color:#fff">D</b></span><span id="altitudeInfo" style="color:#666">高度: 0m</span></div>
      </div>
      <div class="controls-hint">🖱 拖拽旋转 | 🔍 滚轮缩放 | V视角<br>F上车/下车 | R重置 | 空格漂移<br>X 飞行特技</div>
      <div class="minimap"><canvas id="minimapCanvas" width="180" height="180"></canvas></div>
    </div>
    <div id="mobileControls">
      <button class="touch-btn" id="btnLeft">◀</button>
      <button class="touch-btn" id="btnRight">▶</button>
      <button class="touch-btn" id="btnAccel">▲</button>
      <button class="touch-btn" id="btnBrake">⏺</button>
      <button class="touch-btn" id="btnDrift">🔄</button>
      <button class="touch-btn" id="btnNitro" style="background:rgba(255,50,0,0.4)">⚡</button>
      <button class="touch-btn stunt-btn" id="btnStunt">✈️</button>
    </div>
  </div>

  <script type="importmap">
    { "imports": { "three": "https://unpkg.com/three@0.157.0/build/three.module.js" } }
  </script>

  <script type="module">
    import * as THREE from 'three';

    // ==================== 地图尺寸 ====================
    const WORLD = 12000;
    const HALF = WORLD / 2;

    // ==================== 地形：起伏更大 + 跳跃坡 ====================
    const jumpRamps = [
      { x: 1200, z: 800, r: 70, h: 12 },
      { x: -1500, z: -900, r: 65, h: 11 },
      { x: 2000, z: -1400, r: 80, h: 14 },
      { x: -800, z: 1600, r: 60, h: 10 },
      { x: 600, z: -2000, r: 75, h: 13 },
      { x: -2200, z: 400, r: 70, h: 12 },
      { x: 1500, z: 2000, r: 65, h: 11 },
      { x: -1000, z: -1600, r: 80, h: 14 },
      { x: 2800, z: 500, r: 75, h: 12 },
      { x: -2000, z: -300, r: 70, h: 12 },
      { x: 500, z: -800, r: 60, h: 10 },
      { x: -600, z: 600, r: 65, h: 11 }
    ];

    function getHeight(x, z) {
      const cx = THREE.MathUtils.clamp(x, -HALF, HALF);
      const cz = THREE.MathUtils.clamp(z, -HALF, HALF);
      let h = 0;
      h += Math.sin(cx * 0.00035) * Math.cos(cz * 0.00035) * 40;
      h += Math.sin(cx * 0.0008 + 1.5) * Math.cos(cz * 0.0006 + 2.5) * 55;
      h += Math.cos(cx * 0.0015) * Math.sin(cz * 0.0015) * 30;
      h += Math.sin(cx * 0.003 + 0.5) * Math.cos(cz * 0.0025) * 22;
      h += Math.cos(cx * 0.0045 + 2.0) * Math.sin(cz * 0.0035) * 18;
      h += Math.exp(-((cx - 2500) ** 2 + (cz - 1800) ** 2) / 800000) * 140;
      h += Math.exp(-((cx + 2800) ** 2 + (cz + 2200) ** 2) / 900000) * 160;
      h += Math.exp(-((cx - 3500) ** 2 + (cz + 1200) ** 2) / 700000) * 130;
      h += Math.exp(-((cx + 2200) ** 2 + (cz - 2000) ** 2) / 600000) * 120;
      h += Math.exp(-((cx - 4000) ** 2 + (cz - 1000) ** 2) / 750000) * 150;
      h += Math.exp(-((cx + 3500) ** 2 + (cz + 500) ** 2) / 700000) * 115;
      h += Math.exp(-((cx - 500) ** 2 + (cz - 300) ** 2) / 200000) * 90;
      h += Math.exp(-((cx + 800) ** 2 + (cz - 600) ** 2) / 250000) * 80;
      h += Math.exp(-((cx - 1800) ** 2 + (cz + 800) ** 2) / 180000) * 75;
      h += Math.exp(-((cx + 2000) ** 2 + (cz - 400) ** 2) / 220000) * 85;
      h += Math.sin(cx * 0.0006 + 0.5) * 10;
      for (const ramp of jumpRamps) {
        const dx = cx - ramp.x, dz = cz - ramp.z;
        const distSq = dx * dx + dz * dz;
        h += ramp.h * Math.exp(-distSq / (ramp.r * ramp.r * 0.7));
      }
      return h;
    }

    function getNormal(x, z) {
      const d = 3.0;
      const hl = getHeight(x - d, z), hr = getHeight(x + d, z);
      const hd = getHeight(x, z - d), hu = getHeight(x, z + d);
      return new THREE.Vector3(hl - hr, d * 2, hd - hu).normalize();
    }

    // ==================== 场景初始化 ====================
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x87CEEB);
    scene.fog = new THREE.FogExp2(0xc0d8f0, 0.000006);

    const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 1, 20000);
    const renderer = new THREE.WebGLRenderer({ antialias: true, logarithmicDepthBuffer: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.25;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    document.getElementById('gameContainer').appendChild(renderer.domElement);

    scene.add(new THREE.AmbientLight(0x506080, 0.8));
    scene.add(new THREE.HemisphereLight(0x88ccff, 0x3a6a3a, 0.7));

    const sun = new THREE.DirectionalLight(0xfff0d0, 3.5);
    sun.position.set(3000, 5000, 2000);
    sun.castShadow = true;
    sun.shadow.mapSize.set(2048, 2048);
    sun.shadow.camera.near = 1;
    sun.shadow.camera.far = 20000;
    sun.shadow.camera.left = -5000;
    sun.shadow.camera.right = 5000;
    sun.shadow.camera.top = 5000;
    sun.shadow.camera.bottom = -5000;
    sun.shadow.bias = -0.0002;
    scene.add(sun);

    const fillLight = new THREE.DirectionalLight(0xffcc88, 0.8);
    fillLight.position.set(-2000, 3000, -1000);
    scene.add(fillLight);

    // ==================== 渐变天空穹顶 ====================
    const skyGeo = new THREE.SphereGeometry(15000, 32, 32);
    const skyMat = new THREE.ShaderMaterial({
      uniforms: {
        topColor: { value: new THREE.Color(0x3a6ea5) },
        midColor: { value: new THREE.Color(0x87CEEB) },
        bottomColor: { value: new THREE.Color(0xd4e8f5) },
        offset: { value: 1000 },
        exponent: { value: 0.7 }
      },
      vertexShader: `
        varying vec3 vWorldPosition;
        void main() {
          vec4 worldPosition = modelMatrix * vec4(position, 1.0);
          vWorldPosition = worldPosition.xyz;
          gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
        }
      `,
      fragmentShader: `
        uniform vec3 topColor;
        uniform vec3 midColor;
        uniform vec3 bottomColor;
        uniform float offset;
        uniform float exponent;
        varying vec3 vWorldPosition;
        void main() {
          float h = normalize(vWorldPosition + vec3(0.0, offset, 0.0)).y;
          float t = max(0.0, min(1.0, h));
          vec3 col;
          if (t < 0.5) {
            col = mix(bottomColor, midColor, t * 2.0);
          } else {
            col = mix(midColor, topColor, (t - 0.5) * 2.0);
          }
          gl_FragColor = vec4(col, 1.0);
        }
      `,
      side: THREE.BackSide,
      depthWrite: false
    });
    const skyDome = new THREE.Mesh(skyGeo, skyMat);
    scene.add(skyDome);

    // ==================== 云朵系统 ====================
    const cloudGroup = new THREE.Group();
    const cloudMat = new THREE.MeshStandardMaterial({
      color: 0xffffff,
      transparent: true,
      opacity: 0.7,
      roughness: 1.0,
      metalness: 0.0,
      flatShading: true
    });
    const cloudGeo = new THREE.SphereGeometry(1, 7, 5);

    for (let i = 0; i < 120; i++) {
      const cloud = new THREE.Group();
      const clusterCount = 3 + Math.floor(Math.random() * 5);
      for (let j = 0; j < clusterCount; j++) {
        const puff = new THREE.Mesh(cloudGeo, cloudMat.clone());
        puff.material.opacity = 0.5 + Math.random() * 0.4;
        const scale = 80 + Math.random() * 180;
        puff.scale.set(scale, scale * 0.5, scale);
        puff.position.set(
          (Math.random() - 0.5) * 300,
          (Math.random() - 0.5) * 80,
          (Math.random() - 0.5) * 300
        );
        cloud.add(puff);
      }
      cloud.position.set(
        (Math.random() - 0.5) * WORLD * 1.5,
        800 + Math.random() * 600,
        (Math.random() - 0.5) * WORLD * 1.5
      );
      cloud.userData.speed = 2 + Math.random() * 6;
      cloud.userData.startX = cloud.position.x;
      cloud.userData.range = WORLD * 1.5;
      cloudGroup.add(cloud);
    }
    scene.add(cloudGroup);

    // ==================== 地形网格 ====================
    const gs = 300;
    const st = WORLD / gs, vs = [], uv = [], idx = [], cl = [];
    for (let iz = 0; iz <= gs; iz++) {
      for (let ix = 0; ix <= gs; ix++) {
        const x = ix * st - HALF, z = iz * st - HALF, h = getHeight(x, z);
        vs.push(x, h, z); uv.push(ix / gs, iz / gs);

        let r, g, b;
        const n = getNormal(x, z);
        const slope = 1 - n.y;

        let onRamp = false;
        for (const ramp of jumpRamps) {
          const dx = x - ramp.x, dz = z - ramp.z;
          if (dx * dx + dz * dz < ramp.r * ramp.r * 0.6) { onRamp = true; break; }
        }

        if (onRamp) {
          r = 0.85; g = 0.65; b = 0.25;
        } else if (h > 110) {
          const t = Math.min(1, (h - 110) / 60);
          r = 0.85 + t * 0.1; g = 0.85 + t * 0.1; b = 0.9;
        } else if (h > 70) {
          const t = (h - 70) / 40;
          r = 0.55 + t * 0.2; g = 0.5 + t * 0.15; b = 0.4 + t * 0.15;
        } else if (h > 40) {
          const t = (h - 40) / 30;
          r = 0.35 + t * 0.1; g = 0.55 - t * 0.1; b = 0.25;
        } else if (h > 10) {
          const t = (h - 10) / 30;
          r = 0.25 + t * 0.1; g = 0.55 - t * 0.05; b = 0.2 + t * 0.03;
        } else {
          const t = (h + 20) / 30;
          r = 0.2 + t * 0.05; g = 0.45 + t * 0.05; b = 0.15 + t * 0.02;
        }

        if (slope > 0.2 && !onRamp) {
          const rock = Math.min(1, (slope - 0.2) * 4);
          r = r * (1 - rock) + 0.55 * rock;
          g = g * (1 - rock) + 0.5 * rock;
          b = b * (1 - rock) + 0.45 * rock;
        }

        cl.push(r, g, b);
      }
    }
    for (let iz = 0; iz < gs; iz++) for (let ix = 0; ix < gs; ix++) {
      const a = iz * (gs + 1) + ix, b = a + 1, c = a + (gs + 1), d = c + 1;
      idx.push(a, c, b, b, c, d);
    }
    const tg = new THREE.BufferGeometry();
    tg.setAttribute('position', new THREE.Float32BufferAttribute(vs, 3));
    tg.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));
    tg.setAttribute('color', new THREE.Float32BufferAttribute(cl, 3));
    tg.setIndex(idx);
    tg.computeVertexNormals();
    const terrainMat = new THREE.MeshStandardMaterial({
      vertexColors: true,
      roughness: 0.8,
      metalness: 0.05,
      side: THREE.FrontSide,
      flatShading: false
    });
    const tm = new THREE.Mesh(tg, terrainMat);
    tm.receiveShadow = true;
    tm.castShadow = true;
    scene.add(tm);

    // ==================== 道路系统 ====================
    const RW = 22;
    const ROAD_ELEVATION = 0.4;
    const roadPaths = [];

    function addSmoothPath(points, isMain = false) {
      roadPaths.push({ type: 'smooth', points, isMain });
    }

    for (let x = -4800; x <= 4800; x += 1600) {
      const pts = [];
      for (let z = -4800; z <= 4800; z += 400) {
        const offset = Math.sin(z * 0.002 + x * 0.001) * 80;
        pts.push({ x: x + offset, z });
      }
      addSmoothPath(pts, true);
    }
    for (let z = -4800; z <= 4800; z += 1600) {
      const pts = [];
      for (let x = -4800; x <= 4800; x += 400) {
        const offset = Math.cos(x * 0.002 + z * 0.001) * 80;
        pts.push({ x, z: z + offset });
      }
      addSmoothPath(pts, true);
    }

    const diagPts1 = [], diagPts2 = [];
    for (let t = 0; t <= 1; t += 0.02) {
      diagPts1.push({ x: -4800 + t * 9600, z: -4800 + t * 9600 + Math.sin(t * Math.PI) * 500 });
      diagPts2.push({ x: -4800 + t * 9600, z: 4800 - t * 9600 + Math.cos(t * Math.PI) * 500 });
    }
    addSmoothPath(diagPts1, false);
    addSmoothPath(diagPts2, false);

    const ringPoints = [];
    for (let i = 0; i <= 120; i++) {
      const a = (i / 120) * Math.PI * 2;
      const r = 1500 + Math.sin(a * 3) * 250;
      ringPoints.push({ x: Math.cos(a) * r, z: Math.sin(a) * r });
    }
    addSmoothPath(ringPoints, true);

    const ringPoints2 = [];
    for (let i = 0; i <= 100; i++) {
      const a = (i / 100) * Math.PI * 2;
      const r = 800 + Math.cos(a * 4) * 180;
      ringPoints2.push({ x: Math.cos(a) * r, z: Math.sin(a) * r });
    }
    addSmoothPath(ringPoints2, false);

    const mountainPts = [];
    for (let i = 0; i <= 200; i++) {
      const t = i / 200;
      const angle = t * Math.PI * 4;
      const r = 300 + t * 400 + Math.sin(t * Math.PI * 3) * 150;
      mountainPts.push({
        x: 2500 + Math.cos(angle) * r,
        z: 1800 + Math.sin(angle) * r
      });
    }
    addSmoothPath(mountainPts, false);

    // ==================== 道路渲染 ====================
    function renderSmoothRoad(pathData) {
      if (!pathData.points || pathData.points.length < 2) return;
      const pts = pathData.points;
      const isMain = pathData.isMain;
      const sampledPts = [];
      for (let i = 0; i < pts.length - 1; i++) {
        const p1 = pts[i], p2 = pts[i + 1];
        const dx = p2.x - p1.x, dz = p2.z - p1.z;
        const segLen = Math.sqrt(dx * dx + dz * dz);
        const steps = Math.max(1, Math.floor(segLen / 5));
        for (let j = 0; j <= steps; j++) {
          const t = j / steps;
          sampledPts.push({ x: p1.x + dx * t, z: p1.z + dz * t });
        }
      }
      const vertices = [], normals = [], indices = [], colors = [];
      const roadColor = isMain ? new THREE.Color(0x3a3a3a) : new THREE.Color(0x4a4a4a);

      for (let i = 0; i < sampledPts.length; i++) {
        const p = sampledPts[i];
        let dirX, dirZ;
        if (i < sampledPts.length - 1) {
          dirX = sampledPts[i + 1].x - p.x;
          dirZ = sampledPts[i + 1].z - p.z;
        } else {
          dirX = p.x - sampledPts[i - 1].x;
          dirZ = p.z - sampledPts[i - 1].z;
        }
        const len = Math.sqrt(dirX * dirX + dirZ * dirZ) || 1;
        dirX /= len; dirZ /= len;
        const perpX = -dirZ * RW / 2;
        const perpZ = dirX * RW / 2;
        const h = getHeight(p.x, p.z) + ROAD_ELEVATION;
        vertices.push(p.x + perpX, h, p.z + perpZ);
        normals.push(0, 1, 0);
        colors.push(roadColor.r, roadColor.g, roadColor.b);
        vertices.push(p.x - perpX, h, p.z - perpZ);
        normals.push(0, 1, 0);
        colors.push(roadColor.r, roadColor.g, roadColor.b);
      }
      for (let i = 0; i < sampledPts.length - 1; i++) {
        const a = i * 2, b = i * 2 + 1, c = (i + 1) * 2, d = (i + 1) * 2 + 1;
        indices.push(a, c, b, b, c, d);
      }
      const geom = new THREE.BufferGeometry();
      geom.setAttribute('position', new THREE.Float32BufferAttribute(vertices, 3));
      geom.setAttribute('normal', new THREE.Float32BufferAttribute(normals, 3));
      geom.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
      geom.setIndex(indices);
      const mesh = new THREE.Mesh(geom, new THREE.MeshStandardMaterial({
        vertexColors: true, roughness: 0.45, metalness: 0.35, side: THREE.DoubleSide
      }));
      mesh.receiveShadow = true;
      scene.add(mesh);
      addRoadLines(sampledPts, isMain);
    }

    function addRoadLines(sampledPts, isMain) {
      const centerVerts = [];
      for (let i = 0; i < sampledPts.length; i++) {
        const p = sampledPts[i];
        centerVerts.push(p.x, getHeight(p.x, p.z) + ROAD_ELEVATION + 0.03, p.z);
      }
      const centerGeom = new THREE.BufferGeometry();
      centerGeom.setAttribute('position', new THREE.Float32BufferAttribute(centerVerts, 3));
      const centerLine = new THREE.Line(centerGeom, new THREE.LineBasicMaterial({ color: 0xffffff }));
      scene.add(centerLine);

      for (let side of [-1, 1]) {
        const sideVerts = [];
        for (let i = 0; i < sampledPts.length; i++) {
          const p = sampledPts[i];
          let dirX, dirZ;
          if (i < sampledPts.length - 1) {
            dirX = sampledPts[i + 1].x - p.x;
            dirZ = sampledPts[i + 1].z - p.z;
          } else {
            dirX = p.x - sampledPts[i - 1].x;
            dirZ = p.z - sampledPts[i - 1].z;
          }
          const len = Math.sqrt(dirX * dirX + dirZ * dirZ) || 1;
          dirX /= len; dirZ /= len;
          const perpX = -dirZ * (RW / 2 - 1.0) * side;
          const perpZ = dirX * (RW / 2 - 1.0) * side;
          sideVerts.push(p.x + perpX, getHeight(p.x, p.z) + ROAD_ELEVATION + 0.03, p.z + perpZ);
        }
        const sideGeom = new THREE.BufferGeometry();
        sideGeom.setAttribute('position', new THREE.Float32BufferAttribute(sideVerts, 3));
        const sideLine = new THREE.Line(sideGeom, new THREE.LineBasicMaterial({ color: 0xffaa00 }));
        scene.add(sideLine);
      }
    }
    roadPaths.forEach(path => renderSmoothRoad(path));

    // ==================== 道路检测 ====================
    function isOnRoad(x, z) {
      for (const path of roadPaths) {
        if (!path.points) continue;
        for (let i = 0; i < path.points.length - 1; i++) {
          const p1 = path.points[i], p2 = path.points[i + 1];
          const dx = p2.x - p1.x, dz = p2.z - p1.z;
          const lenSq = dx * dx + dz * dz;
          if (lenSq === 0) continue;
          let t = ((x - p1.x) * dx + (z - p1.z) * dz) / lenSq;
          t = Math.max(0, Math.min(1, t));
          const projX = p1.x + t * dx, projZ = p1.z + t * dz;
          const dist = Math.hypot(x - projX, z - projZ);
          if (dist < RW / 2 + 8) return true;
        }
      }
      return false;
    }

    function getClosestRoadInfo(x, z) {
      let bestDist = Infinity, bestAngle = 0, bestProjX = x, bestProjZ = z;
      for (const path of roadPaths) {
        if (!path.points) continue;
        for (let i = 0; i < path.points.length - 1; i++) {
          const p1 = path.points[i], p2 = path.points[i + 1];
          const dx = p2.x - p1.x, dz = p2.z - p1.z;
          const lenSq = dx * dx + dz * dz;
          if (lenSq === 0) continue;
          let t = ((x - p1.x) * dx + (z - p1.z) * dz) / lenSq;
          t = Math.max(0, Math.min(1, t));
          const projX = p1.x + t * dx, projZ = p1.z + t * dz;
          const dist = Math.hypot(x - projX, z - projZ);
          if (dist < bestDist) {
            bestDist = dist;
            bestAngle = Math.atan2(dx, dz);
            bestProjX = projX;
            bestProjZ = projZ;
          }
        }
      }
      return { dist: bestDist, angle: bestAngle, x: bestProjX, z: bestProjZ };
    }

    // ==================== 湖泊 ====================
    const lakes = [
      { x: 3500, z: -2500, rx: 400, rz: 300 },
      { x: -2800, z: 1800, rx: 350, rz: 250 },
      { x: 4200, z: 1200, rx: 320, rz: 230 },
      { x: -3800, z: -1500, rx: 380, rz: 280 },
      { x: 2000, z: 3500, rx: 300, rz: 220 },
      { x: -4500, z: 3000, rx: 350, rz: 260 }
    ];
    function isInLake(x, z) {
      return lakes.some(l => {
        const dx = (x - l.x) / l.rx, dz = (z - l.z) / l.rz;
        return dx * dx + dz * dz < 1;
      });
    }
    lakes.forEach(l => {
      const maxR = Math.max(l.rx, l.rz);
      const lk = new THREE.Mesh(
        new THREE.CircleGeometry(maxR, 48),
        new THREE.MeshStandardMaterial({

    // ==================== 建筑 ====================
    const bd = [];

      const w = 6 + Math.random() * 35, h = 12 + Math.random() * 100, d = 6 + Math.random() * 35;
      const th = getHeight(bx, bz);

    // ==================== 树木 ====================

    // ==================== 岩石 ====================
    for (let i = 0; i < 300; i++) {

    // ==================== 玩家车辆 ====================
    const carGroup = new THREE.Group();
    // 车身组（用于特技旋转）
    const carBodyGroup = new THREE.Group();
    carBodyGroup.add(new THREE.Mesh(new THREE.BoxGeometry(2.4, 0.7, 4.6),

    carBodyGroup.add(new THREE.Mesh(new THREE.BoxGeometry(2.1, 0.5, 2.0),

    const wheels = [], wGeo = new THREE.CylinderGeometry(0.5, 0.5, 0.4, 16),

    [[-1.35, 0.5, 1.4], [1.35, 0.5, 1.4], [-1.35, 0.5, -1.4], [1.35, 0.5, -1.4]].forEach(([x, y, z]) => {

    carBodyGroup.add(new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.2, 0.2), lightMat).translateY(0.9).translateX(-0.8).translateZ(2.2));
    carBodyGroup.add(new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.2, 0.2), lightMat).translateY(0.9).translateX(0.8).translateZ(2.2));
    carGroup.add(carBodyGroup);

    const startX = 0, startZ = 300, startH = getHeight(startX, startZ);

    // 玩家角色
    const playerMesh = new THREE.Group();

    // ==================== NPC 车辆 ====================
    const npcCars = [];
    const NPC_COUNT = 30;

    function createNPCCar(color) {
      const g = new THREE.Group();
      g.add(new THREE.Mesh(new THREE.BoxGeometry(2.2, 0.6, 4.2),
        new THREE.MeshStandardMaterial({ color: color, metalness: 0.6, roughness: 0.25 })).translateY(0.65));
      g.add(new THREE.Mesh(new THREE.BoxGeometry(1.9, 0.4, 1.8),

      [[-1.2, 0.45, 1.3], [1.2, 0.45, 1.3], [-1.2, 0.45, -1.3], [1.2, 0.45, -1.3]].forEach(([x, y, z]) => {
        const wh = new THREE.Mesh(new THREE.CylinderGeometry(0.4, 0.4, 0.3, 8), wMatNPC);
        wh.position.set(x, y, z);
        wh.rotation.z = Math.PI / 2;
        wh.castShadow = true;
        g.add(wh);
      });

    }

    const npcColors = [0x3498db, 0x2ecc71, 0xf39c12, 0x9b59b6, 0x1abc9c, 0xe74c3c, 0xecf0f1, 0x34495e];
    for (let i = 0; i < NPC_COUNT; i++) {
      let sx, sz, attempts = 0;
      do { sx = (Math.random() - 0.5) * WORLD * 0.85; sz = (Math.random() - 0.5) * WORLD * 0.85; attempts++; }
      while ((!isOnRoad(sx, sz) || isInLake(sx, sz)) && attempts < 200);
      if (attempts >= 200) continue;
      const color = npcColors[Math.floor(Math.random() * npcColors.length)];
      const npcGroup = createNPCCar(color);
      const h = getHeight(sx, sz);
      npcGroup.position.set(sx, h + 1.5, sz);

      scene.add(npcGroup);
      npcCars.push({
        mesh: npcGroup, x: sx, z: sz, angle: angle,
        speed: 30 + Math.random() * 25,
        targetSpeed: 30 + Math.random() * 25,
        wheelRot: 0, changeTimer: 0, radius: 2.8,
        baseSpeed: 30 + Math.random() * 25,

      });

    // ==================== 行人系统 ====================
    const pedestrians = [];
    const PED_COUNT = 180;

    function createPedestrian(color, skinColor) {
      const g = new THREE.Group();
      g.add(new THREE.Mesh(new THREE.CapsuleGeometry(0.28, 0.9, 4, 8),
        new THREE.MeshStandardMaterial({ color: color })).translateY(0.8));
      g.add(new THREE.Mesh(new THREE.SphereGeometry(0.3, 8, 8),
        new THREE.MeshStandardMaterial({ color: skinColor })).translateY(1.55));
      return g;
    }

    const pedColors = [0xff6b6b, 0x4ecdc4, 0xffe66d, 0xa06cc4, 0xff9f43, 0x48dbfb, 0xff7f50, 0x9b59b6, 0x2ecc71, 0xe74c3c];
    const skinColors = [0xffccaa, 0xf1c27d, 0x8d5524, 0xffdbac, 0xc68642];

    for (let i = 0; i < PED_COUNT; i++) {
      let px, pz, attempts = 0;
      do { px = (Math.random() - 0.5) * WORLD * 0.8; pz = (Math.random() - 0.5) * WORLD * 0.8; attempts++; }
      while ((!isOnRoad(px, pz) && Math.random() > 0.2) || isInLake(px, pz) || attempts < 300);
      if (attempts >= 300) continue;

      const pedColor = pedColors[Math.floor(Math.random() * pedColors.length)];
      const skinColor = skinColors[Math.floor(Math.random() * skinColors.length)];
      const pedGroup = createPedestrian(pedColor, skinColor);
      const h = getHeight(px, pz);
      pedGroup.position.set(px, h + 0.5, pz);
      const angle = Math.random() * Math.PI * 2;
      pedGroup.rotation.y = angle;
      scene.add(pedGroup);

      pedestrians.push({
        mesh: pedGroup,
        x: px, z: pz,
        angle: angle,
        speed: 1.0 + Math.random() * 2.0,
        targetAngle: angle,
        changeTimer: 0,
        alive: true,
        hitTimer: 0,
        radius: 0.8,
        initialY: h + 0.5
      });
    }

    // ==================== 输入和玩家状态（含特技） ====================
    let mode = 'car';
    const startAngle = 0;
    const car = {
      speed: 0, vel: { x: 0, z: 0 }, maxSpeed: 115, maxReverseSpeed: 25,
      angle: startAngle, nitro: 100, nitroOn: false, gear: 0, rpm: 0,
      steerAng: 0, driftAng: 0, drifting: false, wheelRot: 0, isReversing: false,
      verticalVel: 0, airTime: 0, onGround: true,
      // 特技状态
      stuntActive: false,
      stuntTimer: 0,
      stuntDuration: 2.5,  // 特技持续2.5秒
      stuntCooldown: 0,
      stuntCooldownMax: 5, // 冷却5秒
      stuntRoll: 0,
      stuntPitch: 0,
      stuntType: 0, // 0=前空翻, 1=后空翻, 2=侧翻

    };
    const person = { speed: 7, angle: startAngle };
    const keys = {}, touch = { left: false, right: false, accel: false, brake: false, drift: false, nitro: false, stunt: false };

    window.addEventListener('keydown', e => {
      keys[e.key] = true;
      if ([' ', 'Shift'].includes(e.key)) e.preventDefault();

      if ((e.key === 'x' || e.key === 'X') && !car.stuntActive && car.stuntCooldown <= 0) {
        triggerStunt();

    });
    window.addEventListener('keyup', e => { keys[e.key] = false; });

    ['btnLeft', 'btnRight', 'btnAccel', 'btnBrake', 'btnDrift', 'btnNitro', 'btnStunt'].forEach(id => {
      const btn = document.getElementById(id), prop = id.replace('btn', '').toLowerCase();

      btn.addEventListener('mousedown', e => {

    function triggerStunt() {
      if (car.stuntActive || car.stuntCooldown > 0) return;
      if (mode !== 'car') return;
      
      car.stuntActive = true;
      car.stuntTimer = 0;
      car.stuntType = Math.floor(Math.random() * 3); // 随机特技类型
      car.stuntBoost = 30 + Math.random() * 20; // 特技推力

      // 显示特技指示

      ind.textContent = `✈️ ${stuntNames[car.stuntType]}！`;
      ind.style.display = 'block';
      setTimeout(() => { ind.style.display = 'none'; }, 1500);
    }

    // ==================== 碰撞解决 ====================
    function resolveCollisions(x, z, r, skipNPC = false) {
      let rx = x, rz = z;
      for (const b of bd) {
        const dx = Math.abs(rx - b.x), dz = Math.abs(rz - b.z),
          ox = b.w / 2 + r - dx, oz = b.d / 2 + r - dz;
        if (ox > 0 && oz > 0) {
          if (ox < oz) rx += Math.sign(rx - b.x) * ox;
          else rz += Math.sign(rz - b.z) * oz;
        }
      }
      for (const t of td) {
        const dx = rx - t.x, dz = rz - t.z, dist = Math.sqrt(dx * dx + dz * dz),
          md = t.radius + r;
        if (dist < md && dist > 0.001) {
          const n = 1 / dist;
          rx = t.x + dx * n * md;
          rz = t.z + dz * n * md;
        }
      }
      if (!skipNPC) {
        for (const npc of npcCars) {
          const dx = rx - npc.x, dz = rz - npc.z;
          const dist = Math.sqrt(dx * dx + dz * dz);
          const md = npc.radius + r;
          if (dist < md && dist > 0.001) {
            const nx = dx / dist, nz = dz / dist;
            const pushForce = (md - dist) * 2.5;
            npc.x += nx * pushForce * 0.5;
            npc.z += nz * pushForce * 0.5;
            rx -= nx * pushForce * 0.3;
            rz -= nz * pushForce * 0.3;
          }
        }
      }
      return { x: rx, z: rz };
    }

    function checkPedestrianHit() {
      if (mode !== 'car' || Math.abs(car.speed) < 2) return;
      const hitRadius = 3.5;
      let hitCount = 0;
      for (const ped of pedestrians) {
        if (!ped.alive || ped.hitTimer > 0) continue;
        const dx = carGroup.position.x - ped.x;
        const dz = carGroup.position.z - ped.z;
        const dist = Math.sqrt(dx * dx + dz * dz);
        if (dist < hitRadius) {
          ped.alive = false;
          ped.hitTimer = 3.0;
          hitCount++;
          const knockDir = Math.atan2(dx, dz);
          ped.x += Math.sin(knockDir) * 2;
          ped.z += Math.cos(knockDir) * 2;
          ped.mesh.rotation.z = Math.PI / 2;
          ped.mesh.scale.set(1, 0.5, 1);
          car.speed *= 0.75;
        }
      }
      if (hitCount > 0) {
        const indicator = document.getElementById('pedHitIndicator');
        indicator.style.display = 'block';
        indicator.textContent = `💥 撞到 ${hitCount} 个行人！`;
        setTimeout(() => { indicator.style.display = 'none'; }, 1500);
      }
    }

    function updatePedestrians(dt) {
      for (const ped of pedestrians) {
        if (!ped.alive) {
          ped.hitTimer -= dt;
          if (ped.hitTimer <= 0) {
            ped.alive = true;
            let newX, newZ, attempts = 0;
            do {
              newX = (Math.random() - 0.5) * WORLD * 0.8;
              newZ = (Math.random() - 0.5) * WORLD * 0.8;
              attempts++;
            } while ((isInLake(newX, newZ) || !isOnRoad(newX, newZ)) && attempts < 100);
            if (attempts < 100) { ped.x = newX; ped.z = newZ; }
            ped.mesh.rotation.z = 0;
            ped.mesh.scale.set(1, 1, 1);
          }
          continue;
        }
        ped.changeTimer -= dt;
        if (ped.changeTimer <= 0) {
          ped.changeTimer = 2 + Math.random() * 4;
          ped.targetAngle = ped.angle + (Math.random() - 0.5) * 1.5;
        }
        let angleDiff = ped.targetAngle - ped.angle;
        while (angleDiff > Math.PI) angleDiff -= Math.PI * 2;
        while (angleDiff < -Math.PI) angleDiff += Math.PI * 2;
        ped.angle += angleDiff * 0.1;
        let newX = ped.x + Math.sin(ped.angle) * ped.speed * dt;
        let newZ = ped.z + Math.cos(ped.angle) * ped.speed * dt;
        newX = THREE.MathUtils.clamp(newX, -HALF + 20, HALF - 20);
        newZ = THREE.MathUtils.clamp(newZ, -HALF + 20, HALF - 20);
        if (isInLake(newX, newZ)) {
          ped.targetAngle = ped.angle + Math.PI;
          newX = ped.x;
          newZ = ped.z;
        } else {
          ped.x = newX;
          ped.z = newZ;
        }
        const groundY = getHeight(ped.x, ped.z);
        ped.mesh.position.set(ped.x, groundY + 0.5, ped.z);
        ped.mesh.rotation.y = ped.angle;
        if (ped.alive) {
          ped.mesh.position.y += Math.sin(performance.now() * 0.008 + ped.x) * 0.05;
        }
      }
    }

    window.addEventListener('keydown', e => {
      if (e.key === 'f' || e.key === 'F') {

          playerMesh.visible = true;
          document.getElementById('modeIndicator').textContent = '🚶 步行模式';
        } else if (mode === 'person') {
          const dist = new THREE.Vector3(playerMesh.position.x, 0, playerMesh.position.z)
            .distanceTo(new THREE.Vector3(carGroup.position.x, 0, carGroup.position.z));
          if (dist < 10) {
            mode = 'car';
            car.speed = 0;
            car.isReversing = false;
            playerMesh.visible = false;
            document.getElementById('modeIndicator').textContent = '🚗 驾驶模式';
          }
        }
      }
      if (e.key === 'r' || e.key === 'R') {
        const h = getHeight(startX, startZ);
        carGroup.position.set(startX, h + 2, startZ);
        car.speed = 0;
        car.angle = startAngle;
        car.isReversing = false;
        car.verticalVel = 0;
        car.onGround = true;
        car.stuntActive = false;
        car.stuntCooldown = 0;
        car.stuntRoll = 0;
        car.stuntPitch = 0;
        carBodyGroup.rotation.set(0, 0, 0);
        playerMesh.position.set(startX + 6, h + 1.6, startZ);
      }
    });

    // ==================== 摄像机控制 ====================
    let isDragging = false, prevMouse = { x: 0, y: 0 }, cameraYaw = Math.PI, cameraPitch = 0.5, cameraDistance = 45;
    const container = document.getElementById('gameContainer');
    container.addEventListener('mousedown', e => {
      if (e.button === 0) { isDragging = true; prevMouse.x = e.clientX; prevMouse.y = e.clientY; }
    });
    window.addEventListener('mousemove', e => {
      if (!isDragging) return;
      cameraYaw -= (e.clientX - prevMouse.x) * 0.005;
      cameraPitch -= (e.clientY - prevMouse.y) * 0.005;
      cameraPitch = THREE.MathUtils.clamp(cameraPitch, -1.2, 1.2);
      prevMouse.x = e.clientX;
      prevMouse.y = e.clientY;
    });
    window.addEventListener('mouseup', () => { isDragging = false; });
    container.addEventListener('wheel', e => {
      e.preventDefault();
      cameraDistance += e.deltaY * 0.05;
      cameraDistance = THREE.MathUtils.clamp(cameraDistance, 8, 250);
    }, { passive: false });

    let touchStartDist = 0;
    container.addEventListener('touchstart', e => {
      if (e.touches.length === 1) {
        isDragging = true;
        prevMouse.x = e.touches[0].clientX;
        prevMouse.y = e.touches[0].clientY;
      } else if (e.touches.length === 2) {
        isDragging = false;
        touchStartDist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
      }
    });
    container.addEventListener('touchmove', e => {
      if (e.touches.length === 1 && isDragging) {
        cameraYaw -= (e.touches[0].clientX - prevMouse.x) * 0.005;
        cameraPitch -= (e.touches[0].clientY - prevMouse.y) * 0.005;
        cameraPitch = THREE.MathUtils.clamp(cameraPitch, -1.2, 1.2);
        prevMouse.x = e.touches[0].clientX;
        prevMouse.y = e.touches[0].clientY;
      } else if (e.touches.length === 2) {
        const dist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
        cameraDistance -= (dist - touchStartDist) * 0.05;
        cameraDistance = THREE.MathUtils.clamp(cameraDistance, 8, 250);
        touchStartDist = dist;
      }
    });
    container.addEventListener('touchend', () => { isDragging = false; });

    let viewMode = 'free';
    window.addEventListener('keydown', e => {
      if (e.key === 'v' || e.key === 'V') {
        viewMode = viewMode === 'follow' ? 'free' : 'follow';
        if (viewMode === 'follow') {
          cameraYaw = (mode === 'car' ? car.angle : person.angle) + Math.PI;
          cameraPitch = 0.5;
          cameraDistance = 40;
        }
      }
    });

    // ==================== NPC 车辆更新 ====================
    function updateNPCs(dt) {
      for (let i = 0; i < npcCars.length; i++) {
        const npc = npcCars[i];
        const roadInfo = getClosestRoadInfo(npc.x, npc.z);

        if (roadInfo.dist > 30) {
          let angleDiff = roadInfo.angle - npc.angle;
          while (angleDiff > Math.PI) angleDiff -= Math.PI * 2;
          while (angleDiff < -Math.PI) angleDiff += Math.PI * 2;
          npc.angle += angleDiff * 0.08;
          npc.speed = Math.max(15, npc.speed * 0.98);
        } else {
          npc.changeTimer -= dt;
          if (npc.changeTimer <= 0) {
            npc.changeTimer = 1.0 + Math.random() * 2.5;
            npc.targetSpeed = 35 + Math.random() * 30;
          }
          let targetAngle = roadInfo.angle;
          if (Math.abs(npc.angle - targetAngle) > Math.PI / 2) {
            targetAngle = roadInfo.angle + Math.PI;
          }
          let angleDiff = targetAngle - npc.angle;
          while (angleDiff > Math.PI) angleDiff -= Math.PI * 2;
          while (angleDiff < -Math.PI) angleDiff += Math.PI * 2;
          npc.angle += angleDiff * 0.06;
          npc.speed += (npc.targetSpeed - npc.speed) * 0.5 * dt;
        }
        npc.speed = THREE.MathUtils.clamp(npc.speed, 10, 70);

        let newX = npc.x + Math.sin(npc.angle) * npc.speed * dt;
        let newZ = npc.z + Math.cos(npc.angle) * npc.speed * dt;

        newX = THREE.MathUtils.clamp(newX, -HALF + 20, HALF - 20);
        newZ = THREE.MathUtils.clamp(newZ, -HALF + 20, HALF - 20);

        let blocked = false;
        for (const b of bd) {
          if (Math.abs(newX - b.x) < b.w / 2 + npc.radius && Math.abs(newZ - b.z) < b.d / 2 + npc.radius) {
            blocked = true;
            break;
          }
        }
        if (!blocked) {
          for (const t of td) {
            if (Math.hypot(newX - t.x, newZ - t.z) < t.radius + npc.radius) {
              blocked = true;
              break;
            }
          }
        }

        if (blocked) {
          npc.speed *= 0.9;
          npc.angle += (Math.random() - 0.5) * 0.2;
        } else {
          npc.x = newX;
          npc.z = newZ;
        }

        const groundH = getHeight(npc.x, npc.z);
        npc.mesh.position.set(npc.x, groundH + 1.5, npc.z);

        const n = getNormal(npc.x, npc.z);
        const tiltX = Math.asin(THREE.MathUtils.clamp(Math.cos(npc.angle) * n.x + Math.sin(npc.angle) * n.z, -0.5, 0.5));
        const tiltZ = Math.asin(THREE.MathUtils.clamp(-Math.sin(npc.angle) * n.x + Math.cos(npc.angle) * n.z, -0.5, 0.5));
        npc.mesh.rotation.set(tiltX, npc.angle, tiltZ);

        npc.wheelRot += npc.speed * dt * 5;
      }
    }

    // ==================== 主物理更新（含特技飞行） ====================
    function updatePhysics(dt) {
      if (mode === 'car') {
        const accel = keys['w'] || keys['ArrowUp'] || touch.accel,
          brake = keys['s'] || keys['ArrowDown'] || touch.brake,
          left = keys['a'] || keys['ArrowLeft'] || touch.left,
          right = keys['d'] || keys['ArrowRight'] || touch.right,
          drift = keys[' '] || touch.drift,
          nitro = keys['Shift'] || touch.nitro;

        // 氮气
        if (nitro && car.nitro > 8 && !car.nitroOn && car.speed > 5 && !car.isReversing) car.nitroOn = true;
        if (car.nitroOn && car.nitro <= 0) car.nitroOn = false;
        if (!nitro || car.isReversing) car.nitroOn = false;

        // 倒车
        if (brake && car.speed <= 0.5 && !accel) car.isReversing = true;
        else if (accel || car.speed > 1) car.isReversing = false;

        // 引擎力（特技期间减弱操控）
        let force = 0;
        if (!car.stuntActive) {
          if (car.isReversing) {
            if (brake) force = -3500;
            else if (accel) force = 2500;
            else force = 500;
          } else {
            if (accel) force = 6500;
            else if (brake && car.speed > 0.5) force = -4500;
            else if (brake && car.speed <= 0.5) force = -3000;
            else force = -700;
          }
          if (car.nitroOn && !car.isReversing) {
            force += 6500;
            car.nitro -= 28 * dt;
          } else {
            car.nitro = Math.min(100, car.nitro + 18 * dt);
          }
        } else {
          // 特技中：保持速度，增加推力
          force = car.stuntBoost * 10;
          car.stuntBoost *= 0.99;
        }

        const n = getNormal(carGroup.position.x, carGroup.position.z);
        const sa = Math.acos(Math.min(1, n.y));
        const sf = Math.sin(car.angle) * n.x + Math.cos(car.angle) * n.z;
        const ge = -sf * Math.sin(sa) * 500;

        car.speed += ((force + ge - 0.22 * car.speed * Math.abs(car.speed) - 20 * car.speed * (car.drifting ? 3.5 : 1)) / 950) * dt;
        car.speed = THREE.MathUtils.clamp(car.speed, car.isReversing ? -car.maxReverseSpeed : 0, car.isReversing ? 0 : car.maxSpeed + (car.nitroOn ? 30 : 0) + (car.stuntActive ? 40 : 0));

        // 转向（特技中降低灵敏度）
        const steerSensitivity = car.stuntActive ? 1.5 : 4.5;
        if (left) car.steerAng = Math.min(0.55, car.steerAng + steerSensitivity * dt);
        else if (right) car.steerAng = Math.max(-0.55, car.steerAng - steerSensitivity * dt);
        else car.steerAng *= Math.exp(-10 * dt);

        // 漂移
        car.drifting = drift && Math.abs(car.speed) > 12 && !car.isReversing && !car.stuntActive;
        if (car.drifting) {
          car.driftAng += car.steerAng * 4.0 * dt;
          car.driftAng = THREE.MathUtils.clamp(car.driftAng, -1.0, 1.0);
        } else {
          car.driftAng *= Math.exp(-8 * dt);
        }

        // 车身旋转
        if (Math.abs(car.speed) > 0.5) {
          const speedFactor = Math.max(0.05, 1 - Math.abs(car.speed) / car.maxSpeed * 0.9);
          car.angle += ((car.speed / 7.0) * Math.tan(car.steerAng * speedFactor) + car.driftAng * 2.8) * dt;
        }

        // 水平速度
        const ma = car.angle + car.driftAng * 0.6;
        car.vel.x = Math.sin(ma) * car.speed;
        car.vel.z = Math.cos(ma) * car.speed;

        carGroup.position.x += car.vel.x * dt;
        carGroup.position.z += car.vel.z * dt;

        // 碰撞
        const col = resolveCollisions(carGroup.position.x, carGroup.position.z, 2.8, false);
        if (col.x !== carGroup.position.x || col.z !== carGroup.position.z) {
          carGroup.position.x = col.x;
          carGroup.position.z = col.z;
          car.speed *= 0.5;
        }

        // 边界
        carGroup.position.x = THREE.MathUtils.clamp(carGroup.position.x, -HALF + 15, HALF - 15);
        carGroup.position.z = THREE.MathUtils.clamp(carGroup.position.z, -HALF + 15, HALF - 15);

        // ========== 垂直物理（含特技） ==========
        const groundY = getHeight(carGroup.position.x, carGroup.position.z);
        const currentY = carGroup.position.y;

        // 特技计时
        if (car.stuntActive) {
          car.stuntTimer += dt;
          
          // 特技旋转动画
          const t = car.stuntTimer / car.stuntDuration;
          if (car.stuntType === 0) {
            // 前空翻（绕X轴旋转）
            carBodyGroup.rotation.x = -t * Math.PI * 2;
            carBodyGroup.rotation.z = 0;
          } else if (car.stuntType === 1) {
            // 后空翻
            carBodyGroup.rotation.x = t * Math.PI * 2;
            carBodyGroup.rotation.z = 0;
          } else {
            // 侧翻（绕Z轴旋转）
            carBodyGroup.rotation.z = t * Math.PI * 2;
            carBodyGroup.rotation.x = 0;
          }
          
          // 特技结束
          if (car.stuntTimer >= car.stuntDuration) {
            car.stuntActive = false;
            car.stuntCooldown = car.stuntCooldownMax;
            carBodyGroup.rotation.set(0, 0, 0);
          }
        } else {
          // 冷却
          if (car.stuntCooldown > 0) {
            car.stuntCooldown -= dt;
            if (car.stuntCooldown < 0) car.stuntCooldown = 0;
          }
          // 恢复车身
          carBodyGroup.rotation.x *= Math.exp(-8 * dt);
          carBodyGroup.rotation.z *= Math.exp(-8 * dt);
        }

        // 重力
        car.verticalVel -= 25 * dt;

        const nextGroundY = getHeight(
          carGroup.position.x + car.vel.x * dt * 0.5,
          carGroup.position.z + car.vel.z * dt * 0.5
        );

        const carBottom = currentY - 1.2;
        const groundDist = carBottom - nextGroundY;

        if (car.onGround) {
          const heightChange = nextGroundY - groundY;
          // 高速下坡或跳跃坡起飞
          if (heightChange < -0.5 && Math.abs(car.speed) > 15) {
            car.onGround = false;
            const slopeAngle = Math.atan2(heightChange, Math.abs(car.speed) * dt + 0.1);
            car.verticalVel = Math.abs(car.speed) * Math.sin(slopeAngle) * 1.5 + 3;
          } else {
            carGroup.position.y = groundY + 1.2;
            car.verticalVel = 0;
          }
        }

        if (!car.onGround) {
          carGroup.position.y += car.verticalVel * dt;
          car.airTime += dt;

          const currentGroundY = getHeight(carGroup.position.x, carGroup.position.z);
          // 着陆检测（特技期间不检测着陆，让特技自然完成）
          if (!car.stuntActive && carGroup.position.y <= currentGroundY + 1.2) {
            carGroup.position.y = currentGroundY + 1.2;
            car.verticalVel = 0;
            car.onGround = true;
            car.airTime = 0;
          }
        } else {
          carGroup.position.y += (groundY + 1.2 - carGroup.position.y) * 0.5;
        }

        // 车身倾斜（特技时忽略地形倾斜）
        if (!car.stuntActive) {
          const tn = getNormal(carGroup.position.x, carGroup.position.z);
          const tiltX = Math.asin(THREE.MathUtils.clamp(Math.cos(car.angle) * tn.x + Math.sin(car.angle) * tn.z, -0.6, 0.6));
          const tiltZ = Math.asin(THREE.MathUtils.clamp(-Math.sin(car.angle) * tn.x + Math.cos(car.angle) * tn.z, -0.6, 0.6));
          carGroup.rotation.set(tiltX, car.angle, tiltZ);
        } else {
          // 特技期间保持朝向，车身组负责旋转动画
          carGroup.rotation.set(0, car.angle, 0);
        }

        // 仪表
        const as = Math.abs(car.speed);
        car.gear = as < 2 ? 0 : as < 15 ? 1 : as < 28 ? 2 : as < 42 ? 3 : as < 58 ? 4 : as < 75 ? 5 : 6;
        car.rpm = as / car.maxSpeed;
        car.wheelRot += car.speed * dt * 5;
        wheels.forEach(w => { w.rotation.x += car.wheelRot * dt * 6; });

        // 行人碰撞
        checkPedestrianHit();
        
      } else {
        // 步行模式
        const fwd = keys['w'] || keys['ArrowUp'] || touch.accel,
          back = keys['s'] || keys['ArrowDown'] || touch.brake,
          left = keys['a'] || keys['ArrowLeft'] || touch.left,
          right = keys['d'] || keys['ArrowRight'] || touch.right;
        if (left) person.angle -= 2.5 * dt;
        if (right) person.angle += 2.5 * dt;
        let spd = 0;
        if (fwd) spd = person.speed;
        if (back) spd = -person.speed * 0.6;
        playerMesh.position.x += Math.sin(person.angle) * spd * dt;
        playerMesh.position.z += Math.cos(person.angle) * spd * dt;
        playerMesh.position.x = THREE.MathUtils.clamp(playerMesh.position.x, -HALF + 10, HALF - 10);
        playerMesh.position.z = THREE.MathUtils.clamp(playerMesh.position.z, -HALF + 10, HALF - 10);

        const col = resolveCollisions(playerMesh.position.x, playerMesh.position.z, 0.6, false);
        if (col.x !== playerMesh.position.x || col.z !== playerMesh.position.z) {
          playerMesh.position.x = col.x;
          playerMesh.position.z = col.z;
        }
        playerMesh.position.y += (getHeight(playerMesh.position.x, playerMesh.position.z) + 1.6 - playerMesh.position.y) * 0.4;
        playerMesh.rotation.y = person.angle;
      }
    }

    // ==================== 摄像机更新 ====================
    function updateCam() {
      const target = mode === 'car' ? carGroup.position : playerMesh.position,
        targetAngle = mode === 'car' ? car.angle : person.angle;
      if (viewMode === 'follow') {
        cameraYaw += (targetAngle + Math.PI - cameraYaw) * 0.05;
      }
      // 特技时稍微拉远镜头
      const dist = car.stuntActive ? cameraDistance * 1.3 : cameraDistance;
      const cx = target.x + Math.sin(cameraYaw) * Math.cos(cameraPitch) * dist,
        cy = target.y + Math.sin(cameraPitch) * dist,
        cz = target.z + Math.cos(cameraYaw) * Math.cos(cameraPitch) * dist;
      camera.position.lerp(new THREE.Vector3(cx, cy, cz), 0.08);
      camera.lookAt(target.x, target.y + 1.5, target.z);
    }

    // ==================== HUD 更新 ====================
    function updateHUD() {
      const spd = mode === 'car' ? Math.abs(car.speed) * 3.6 : 0;
      const alt = mode === 'car' ? carGroup.position.y : playerMesh.position.y;
      document.getElementById('speedText').textContent = Math.floor(spd);
      document.getElementById('altitudeInfo').textContent = '高度: ' + alt.toFixed(1) + 'm';

      if (mode === 'car') {
        const ge = document.getElementById('gearText');
        if (car.isReversing) {
          ge.textContent = 'R';
          ge.className = 'gear-box gear-reverse';
        } else {
          ge.textContent = car.gear === 0 ? 'N' : car.gear;
          ge.className = 'gear-box';
        }
        document.getElementById('nitroFill').style.width = car.nitro + '%';
        document.getElementById('rpmText').textContent = Math.floor(car.rpm * 8500);
        
        // 状态显示
        let status = '稳定';
        let statusColor = '#888';
        if (car.stuntActive) {
          status = '✈️ 特技中';
          statusColor = '#ffcc00';
        } else if (car.drifting) {
          status = '🔥 漂移';
          statusColor = '#ff4400';
        } else if (!car.onGround) {
          status = '🛫 空中';
          statusColor = '#44aaff';
        }
        document.getElementById('driftStatus').textContent = status;
        document.getElementById('driftStatus').style.color = statusColor;
        
        document.getElementById('gearMode').textContent = car.isReversing ? 'R' : 'D';
        document.getElementById('gearMode').style.color = car.isReversing ? '#ff4444' : '#fff';
      } else {
        document.getElementById('gearText').textContent = '🚶';
        document.getElementById('gearText').className = 'gear-box';
        document.getElementById('nitroFill').style.width = '0%';
        document.getElementById('rpmText').textContent = '0';
        document.getElementById('driftStatus').textContent = '步行';
        document.getElementById('driftStatus').style.color = '#888';
        document.getElementById('gearMode').textContent = '🚶';
        document.getElementById('gearMode').style.color = '#fff';
      }

      // 小地图
      const mc = document.getElementById('minimapCanvas'), ctx = mc.getContext('2d');
      ctx.clearRect(0, 0, 180, 180);
      ctx.fillStyle = '#1a2e1a';
      ctx.fillRect(0, 0, 180, 180);

      const sc = 0.012;
      const ox = 90, oy = 90;

      ctx.strokeStyle = '#666';
      ctx.lineWidth = 1.5;
      for (const path of roadPaths) {
        if (!path.points) continue;
        ctx.beginPath();
        for (let i = 0; i < path.points.length; i++) {
          const p = path.points[i];
          const px = p.x * sc + ox, py = p.z * sc + oy;
          if (i === 0) ctx.moveTo(px, py);
          else ctx.lineTo(px, py);
        }
        ctx.stroke();
      }

      ctx.fillStyle = 'rgba(255, 200, 0, 0.6)';
      for (const ramp of jumpRamps) {
        ctx.beginPath();
        ctx.arc(ramp.x * sc + ox, ramp.z * sc + oy, ramp.r * sc * 0.8, 0, Math.PI * 2);
        ctx.fill();
      }

      ctx.fillStyle = '#ffaa00';
      for (const npc of npcCars) {
        ctx.beginPath();
        ctx.arc(npc.x * sc + ox, npc.z * sc + oy, 2.5, 0, Math.PI * 2);
        ctx.fill();
      }

      ctx.fillStyle = '#00ff88';
      for (const ped of pedestrians) {
        if (!ped.alive) continue;
        ctx.beginPath();
        ctx.arc(ped.x * sc + ox, ped.z * sc + oy, 1.8, 0, Math.PI * 2);
        ctx.fill();
      }

      const p = mode === 'car' ? carGroup.position : playerMesh.position;
      ctx.fillStyle = mode === 'car' ? (car.stuntActive ? '#ffcc00' : '#00ffff') : '#ffcc00';
      ctx.beginPath();
      ctx.arc(p.x * sc + ox, p.z * sc + oy, 4.5, 0, Math.PI * 2);
      ctx.fill();

      const angle = mode === 'car' ? car.angle : person.angle;
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(p.x * sc + ox, p.z * sc + oy);
      ctx.lineTo((p.x + Math.sin(angle) * 18) * sc + ox, (p.z + Math.cos(angle) * 18) * sc + oy);
      ctx.stroke();
    }

    // ==================== 云朵动画 ====================
    function updateClouds(dt) {
      for (const cloud of cloudGroup.children) {
        cloud.position.x += cloud.userData.speed * dt;
        if (cloud.position.x - cloud.userData.startX > cloud.userData.range) {
          cloud.position.x = cloud.userData.startX - cloud.userData.range;
        }
      }
    }

    // ==================== 主循环 ====================
    let lt = performance.now();
    function loop(now) {
      const dt = Math.min((now - lt) / 1000, 0.05);
      lt = now;

      updateClouds(dt);
      updateNPCs(dt);
      updatePedestrians(dt);
      updatePhysics(dt);
      updateCam();
      updateHUD();

      renderer.render(scene, camera);
      requestAnimationFrame(loop);
    }

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    requestAnimationFrame(loop);
    console.log('✈️ 飞行特技已加入 | 按 X 键或点击 ✈️ 按钮触发');
  </script>
</body>
